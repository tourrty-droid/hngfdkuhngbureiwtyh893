name: Roblox Badge Tracker

on:
  schedule:
    - cron: "*/5 * * * *"     # каждые 5 минут (UTC)
  workflow_dispatch:          # кнопка "Run workflow" вручную

permissions:
  contents: write             # чтобы коммитить state.json обратно

concurrency:
  group: badge-tracker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run tracker
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID:   ${{ secrets.CHAT_ID }}
        run: python tracker.py

      - name: Save state
        run: |
          git config user.name  "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "chore: update state [skip ci]"
          git push
